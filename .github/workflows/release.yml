name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
    -   uses: actions/checkout@v6
    -   name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: '3.12'
    -   name: Install
        run: uv sync --locked --dev --python 3.12
    -   name: Test
        run: uv run --python 3.12 pytest
    -   name: Run pre-commit
        run: uv run --python 3.12 pre-commit run --all-files --show-diff-on-failure

  build:
    name: build
    needs: checks
    runs-on: ubuntu-latest
    steps:
    -   uses: actions/checkout@v6
    -   name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: '3.12'
    -   name: Build distributions
        run: uv build --python 3.12
    -   name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
    -   name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist
    -   name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
